name: Refresh prices
on:
  schedule:
    - cron: "0 18 * * *"      # daily 03:00 KST — Naver
    - cron: "30 18 * * 1"     # Mondays — add Google Shopping (SerpApi free tier is 100/month)
  workflow_dispatch:
    inputs:
      engines:
        description: "Engines to query (google costs 30 SerpApi searches)"
        default: "naver"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch prices
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/fetch_prices.py ${{ inputs.engines }}
          elif [ "${{ github.event.schedule }}" = "30 18 * * 1" ]; then
            python scripts/fetch_prices.py naver google
          else
            python scripts/fetch_prices.py naver
          fi
      - name: Commit if changed
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || (git commit -m "Refresh prices $(date -u +%F)" && git push)
